version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: itsm_sql_server
    # restart: unless-stopped -> Sunucu veya Docker yeniden başladığında container'ın otomatik ayağa kalkmasını sağlar.
    restart: unless-stopped
    environment:
      # Microsoft EULA (Son Kullanıcı Lisans Anlaşması) kabul zorunluluğu
      - ACCEPT_EULA=Y
      # MSSQL 2022 için güçlü bir SA şifresi (En az 8 karakter, büyük/küçük harf, rakam ve sembol içermelidir)
      - MSSQL_SA_PASSWORD=Password123
      # Lisans Katmanı: Developer (Ücretsiz, geliştirme ve test ortamları için tam özellikli)
      - MSSQL_PID=Developer
    ports:
      # Dış dünyadan/Host makineden SQL Server portuna erişim (1433)
      - "1433:1433"
    volumes:
      # Veri Kalıcılığı (Data Persistence): Container silinse bile verilerin kaybolmamasını sağlar.
      - mssql_data:/var/opt/mssql
      # Hazırladığımız ITSM SQL scriptlerini container içine salt okunur (ro) olarak mount ederiz.
      # Bütün proje dizinini bağlamak istiyorsan "./:/usr/work/scripts:ro" yapabilirsin.
      - ./:/usr/work/scripts:ro
    # Senior Dokunuşu: Container'ın gerçekten "çalışır" ve "veritabanı sorgusu alabilir" durumda 
    # olduğunu Docker daemon'a bildiren sağlık kontrolü (Healthcheck) mekanizması.
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password123", "-C", "-Q", "SELECT 1" ]
      interval: 10s   # Her 10 saniyede bir kontrol et
      timeout: 5s     # 5 saniye içinde yanıt alamazsa başarısız say
      retries: 5      # 5 kez üst üste başarısız olursa container'ı 'unhealthy' ilan et
      start_period: 15s # İlk açılışta motorun kendine gelmesi için tanınan süre

volumes:
  mssql_data:
    driver: local